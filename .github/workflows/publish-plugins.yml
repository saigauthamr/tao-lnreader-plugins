name: Publish Plugins

on:
  push:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: publish-plugins
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'

      - name: Install dependencies
        run: npx --yes pnpm@12.21.0 install --frozen-lockfile --ignore-scripts

      - name: Build and publish
        env:
          BRANCH: plugins/v3.0.0
        shell: bash
        run: |
          npm run build
          jq -e 'length == 1 and .[0].id == "fanfictionnet"' .dist/plugins.min.json

          git config user.name saigauthamr
          git config user.email '122163817+saigauthamr@users.noreply.github.com'
          publish_dir="$RUNNER_TEMP/plugins-publish"
          if git show-ref --verify --quiet "refs/remotes/origin/$BRANCH"; then
            git worktree add --detach "$publish_dir" "origin/$BRANCH"
          else
            git worktree add --detach "$publish_dir" HEAD
            git -C "$publish_dir" switch --orphan "$BRANCH"
          fi

          mkdir -p "$publish_dir/.dist" "$publish_dir/.js/src/plugins" "$publish_dir/public"
          rsync -ac --delete .dist/ "$publish_dir/.dist/"
          rsync -ac --delete .js/src/plugins/ "$publish_dir/.js/src/plugins/"
          rsync -ac --delete public/ "$publish_dir/public/"
          cmp .dist/plugins.min.json "$publish_dir/.dist/plugins.min.json"
          cd "$publish_dir"
          git rm --ignore-unmatch total.svg
          git add -Af -- .dist .js/src/plugins public
          if ! git diff --cached --quiet; then
            git commit -m "chore: publish FanFiction.Net plugin"
            git push origin "HEAD:refs/heads/$BRANCH"
          fi
